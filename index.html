<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Gestor de recursos y puntos de vida en tiempo real para personajes de Pathfinder" />
    <title>Recursos Pathfinder</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('pathfinder_theme_v1') || 'light';
          var root = document.documentElement;
          // Mantener sincronizado con AVAILABLE_THEMES en src/domain/theme.ts
          var themes = ['light', 'warm', 'dark', 'arcane', 'forge', 'grove'];
          var darkThemes = ['dark', 'arcane', 'forge'];
          if (themes.indexOf(theme) === -1) theme = 'light';
          root.classList.remove.apply(root.classList, themes);
          root.classList.add(theme);
          if (darkThemes.indexOf(theme) !== -1) {
            root.classList.add('dark');
          }
          root.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-100 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen antialiased select-none touch-manipulation transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
